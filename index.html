<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMEN AI - География Мечты</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>
    <nav class="fixed w-full z-50 p-6 flex justify-between items-center bg-black/40 backdrop-blur-sm">
        <div class="text-2xl font-serif italic tracking-tighter">LUMEN AI</div>
        <div class="text-[10px] uppercase tracking-[0.3em] opacity-70">Project: Wedding in GES-2</div>
    </nav>

    <section class="relative h-screen flex items-center justify-center text-center px-4 overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80" class="w-full h-full object-cover opacity-50" alt="Background">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black"></div>
        </div>
        
        <div class="relative z-10 max-w-4xl">
            <span class="inline-block mb-4 text-[10px] uppercase tracking-[0.5em] opacity-60">Digital Couture 2026</span>
            <h1 class="text-6xl md:text-8xl font-serif italic mb-6 tracking-tighter">География Мечты</h1>
            <p class="text-lg md:text-xl font-light opacity-80 mb-10 max-w-2xl mx-auto leading-relaxed">
                Иммерсивный контент для свадебных брендов. Люкс, созданный искусственным интеллектом.
            </p>
            <div class="flex flex-wrap justify-center gap-8">
                <div class="flex items-center gap-3"><i data-lucide="sparkles" class="w-4 h-4 opacity-50"></i><span class="text-[10px] uppercase tracking-widest">AI Production</span></div>
                <div class="flex items-center gap-3"><i data-lucide="globe" class="w-4 h-4 opacity-50"></i><span class="text-[10px] uppercase tracking-widest">Global Locations</span></div>
            </div>
        </div>
    </section>

    <script>lucide.createIcons();</script>
</body>
</html>
